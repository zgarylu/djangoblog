{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'appname/bootstrap-5.3.8-dist/css/bootstrap.min.css' %}" rel="stylesheet" />
    <title>LoginView</title>
</head>
<style>
    input[type=text], input[type=password]{width:100%; padding:12px 20px; margin:8px 0; display:inline-block; border:1px solid #ccc; border-radius:4px; box-size:border-box;}
    input[type=submit]{width:100%; padding:14px 20px; margin:8px 0; background-color:#4CAF50; color:white; border:none; border-radius:4px; cursor:pointer;}
    input[type=submit]:hover{background-color:#45a049;}
    body{border-radius:5px; background-color:#f2f2f2; padding:20px;}
    #content {max-width: 700px; margin: 50px auto;}
</style>
<body>
<div class="container-fluid">
    <div id="content">
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        {{form.username.label_tag}}
        {{form.username}}
        {{form.password.label_tag}}
        {{form.password}}
        {{form.errors}}
        <input type="submit" value="Login">
    </form>
    </div>
</div>
</body>
</html>
